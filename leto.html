<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Обратный отсчёт до ЛЕТА!</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      text-align: center;
      color: white;
    }

    body {
      background: linear-gradient(to top, #ffe58a 0% 30%, #00bfff 30% 70%, #87ceeb 70% 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sun {
      position: absolute;
      top: 40px;
      left: 80%;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #fff700, #ff9900);
      border-radius: 50%;
      box-shadow: 0 0 60px #ffd700;
      animation: spin 20s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    .cloud {
      position: absolute;
      top: 60px;
      width: 120px;
      height: 60px;
      background: #fff;
      border-radius: 50px;
      opacity: 0.8;
      animation: floatCloud 60s linear infinite;
      z-index: 2;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud::before {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 10px;
    }

    .cloud::after {
      width: 70px;
      height: 70px;
      top: -35px;
      left: 50px;
    }

    .cloud1 { left: -200px; animation-delay: 0s; }
    .cloud2 { left: -400px; top: 100px; animation-delay: 20s; }
    .cloud3 { left: -600px; top: 160px; animation-delay: 40s; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(1600px); }
    }

    .ocean {
      position: absolute;
      bottom: 20%;
      width: 100%;
      height: 10%;
      background: linear-gradient(to top, #0077be, #00bfff);
      overflow: hidden;
      z-index: 1;
    }

    .wave {
      position: absolute;
      width: 200%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><path fill="%23ffffff" d="M0 20 Q30 0 60 20 T120 20 T180 20 T240 20 V40 H0 Z" /></svg>') repeat-x;
      background-size: 120px 40px;
      animation: waveAnim 8s linear infinite;
      opacity: 0.3;
    }

    @keyframes waveAnim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .sand {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20%;
      background: #ffe58a;
      z-index: 0;
    }

    h1 {
      font-size: 3em;
      text-shadow: 2px 2px 6px #000;
      z-index: 3;
    }

    #countdown {
      font-size: 2em;
      margin-top: 10px;
      text-shadow: 1px 1px 4px #000;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="sun"></div>

  <!-- Облака -->
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <!-- Волны -->
  <div class="ocean">
    <div class="wave"></div>
  </div>

  <!-- Песок -->
  <div class="sand"></div>

  <!-- Контент -->
  <h1>До ЛЕТА осталось:</h1>
  <div id="countdown">Загрузка...</div>

  <script>
    const countdown = document.getElementById('countdown');
    const summerDate = new Date('2025-06-01T00:00:00');

    function updateCountdown() {
      const now = new Date();
      const diff = summerDate - now;

      if (diff <= 0) {
        countdown.innerHTML = "ЛЕТО НАСТАЛО! 🏖️☀️🎉";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdown.innerHTML =
        `${days} дней, ${hours} часов, ${minutes} минут, ${seconds} секунд`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
